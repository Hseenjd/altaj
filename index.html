<header><svg class="lg" viewBox="0 0 9 9"><use href="#lg"/></svg><h1 id="ht">بكسل ستور</h1><button class="bk" id="bk" aria-label="رجوع">→</button></header>

<script>
const $=s=>document.querySelector(s),nf=n=>(+n).toLocaleString("en-US"),BRAND="بكسل ستور";

try{cart=JSON.parse(localStorage.getItem("cart")||"{}")}catch(e){}

const CI={"حاسبات":"🖥️","كيبوردات":"⌨️","كيبوردات ألعاب":"🎮","موسات":"🖱️"},TINT={kbred:"#ff4d4d",kbblue:"#4d8dff",kbgreen:"#3ddc84",kbrgb:"#c04dff"};

 $("#v").innerHTML=`<div class="v">${h}</div>`;

 return t.it.map(({x,q})=>`<div class="row"><div class="th">${x.img?`<img src="${esc(x.img)}" alt="">`:EM(x.e)}</div><div class="in"><b>${esc(x.n)}</b><small>${nf(x.p*q)} د.ع</small></div><div class="q"><button data-q="${x.id}" data-d="-1">−</button><b>${q}</b><button data-q="${x.id}" data-d="1">+</button></div></div>`).join("")+
 `<div class="tot"><div><span>المجموع</span><span>${nf(t.sub)} د.ع</span></div><div><span>التوصيل</span><span>${nf(t.del)} د.ع</span></div><div class="t"><span>الإجمالي</span><span>${nf(t.total)} د.ع</span></div></div>
 <input id="name" placeholder="الاسم" autocomplete="name"><input id="phone" placeholder="رقم الهاتف" inputmode="tel" autocomplete="tel"><select id="prov">${PROV.map(p=>`<option>${p}</option>`).join("")}</select><input id="addr" placeholder="المنطقة / العنوان"><textarea id="note" rows="2" placeholder="ملاحظات (اختياري)"></textarea><input class="hp" id="hp" tabindex="-1" autocomplete="off"><div class="err" id="err"></div><a class="send" id="send" target="_blank" rel="noopener">إرسال الطلب عبر واتساب 💬</a>`;}

 if(t.dataset.add){cart[t.dataset.add]=(cart[t.dataset.add]||0)+1;save();render0();toast("تمت الإضافة للسلة ✓");}
 else if(t.dataset.q){const id=t.dataset.q,n=(cart[id]||0)+ +t.dataset.d;n>0?cart[id]=n:delete cart[id];save();render();}

 $("#err").textContent=err;if(err){e.preventDefault();return;}
 try{localStorage.setItem("last",Date.now())}catch(x){}
 const id="R"+Date.now().toString(36).slice(-5).toUpperCase(),o={id,t:Date.now(),name:$("#name").value.trim(),phone:ph,prov:$("#prov").value,addr:$("#addr").value.trim(),note:$("#note").value.trim(),items:t.it.map(i=>({id:i.x.id,n:i.x.n,q:i.q,p:i.x.p})),sub:t.sub,disc:0,coupon:"",del:t.del,total:t.total,status:"pending"};
 if(db)db.collection("orders").doc(id).set(o).catch(()=>{});
 const m=`طلب جديد من بكسل ستور #${id}\nالاسم: ${o.name}\nالهاتف: ${ph}\nالمحافظة: ${o.prov}\nالعنوان: ${o.addr}\n\n`+o.items.map(i=>`• ${i.n} × ${i.q} = ${nf(i.p*i.q)} د.ع`).join("\n")+`\n\nالمجموع: ${nf(t.sub)} د.ع\nالتوصيل: ${nf(t.del)} د.ع\nالإجمالي: ${nf(t.total)} د.ع`+(o.note?`\nملاحظات: ${o.note}`:"");
 a.href=`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(m)}`;
 setTimeout(()=>{cart={};save();go("home");toast("تم تجهيز طلبك، أكمل الإرسال من واتساب ✓");},700);}
function apply(d){if(d&&d.P){P=typeof d.P==="string"?JSON.parse(d.P):d.P;if(d.DELIVERY!=null)DELIVERY=+d.DELIVERY;if(d.WHATSAPP)WHATSAPP=String(d.WHATSAPP);}}
fetch("store-data.json").then(r=>r.json()).then(d=>{apply(d);render();}).catch(()=>render()).finally(()=>{
 try{firebase.initializeApp(firebaseConfig);db=firebase.firestore();db.doc("store/main").onSnapshot(s=>{if(s.exists){try{apply(s.data());if(!document.activeElement||!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))render();}catch(e){}}},()=>{});}catch(e){}});
(function(){for(let i=0;i<(innerWidth<600?7:12);i++){const s=document.createElement("i"),z=3+Math.random()*5;s.className="sp";s.style.cssText=`left:${Math.random()*100}vw;width:${z}px;height:${z}px;--dx:${Math.random()*100-50}px;animation-duration:${9+Math.random()*9}s;animation-delay:${-Math.random()*14}s`;document.body.appendChild(s);}})();
const STANDALONE=matchMedia("(display-mode:standalone)").matches||navigator.standalone===true;let dip=null;
addEventListener("beforeinstallprompt",e=>{e.preventDefault();dip=e;});
addEventListener("appinstalled",()=>{dip=null;document.querySelectorAll("[data-inst],#inst").forEach(x=>x.remove());});
function how(){const ios=/iphone|ipad|ipod/i.test(navigator.userAgent),s=document.createElement("div");
 s.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:90;display:flex;align-items:flex-end";

 s.onclick=e=>{if(e.target===s||e.target.tagName==="BUTTON")s.remove();};document.body.appendChild(s);}
async function inst(){if(dip){dip.prompt();try{const r=await dip.userChoice;if(r.outcome==="accepted")dip=null;}catch(e){}return;}how();}
